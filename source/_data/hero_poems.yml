- text: 长风破浪会有时，直挂云帆济沧海。
  author: 李白
  work: 行路难·其一
- text: 天生我材必有用，千金散尽还复来。
  author: 李白
  work: 将进酒
- text: 大鹏一日同风起，扶摇直上九万里。
  author: 李白
  work: 上李邕
- text: 相看两不厌，只有敬亭山。
  author: 李白
  work: 独坐敬亭山
- text: 会当凌绝顶，一览众山小。
  author: 杜甫
  work: 望岳
- text: 读书破万卷，下笔如有神。
  author: 杜甫
  work: 奉赠韦左丞丈二十二韵
- text: 随风潜入夜，润物细无声。
  author: 杜甫
  work: 春夜喜雨
- text: 纸上得来终觉浅，绝知此事要躬行。
  author: 陆游
  work: 冬夜读书示子聿
- text: 山重水复疑无路，柳暗花明又一村。
  author: 陆游
  work: 游山西村
- text: 千淘万漉虽辛苦，吹尽狂沙始到金。
  author: 刘禹锡
  work: 浪淘沙·其八
- text: 沉舟侧畔千帆过，病树前头万木春。
  author: 刘禹锡
  work: 酬乐天扬州初逢席上见赠
- text: 莫听穿林打叶声，何妨吟啸且徐行。
  author: 苏轼
  work: 定风波·莫听穿林打叶声
- text: 人生如逆旅，我亦是行人。
  author: 苏轼
  work: 临江仙·送钱穆父
- text: 但愿人长久，千里共婵娟。
  author: 苏轼
  work: 水调歌头·明月几时有
- text: 行到水穷处，坐看云起时。
  author: 王维
  work: 终南别业
- text: 明月松间照，清泉石上流。
  author: 王维
  work: 山居秋暝
- text: 海内存知己，天涯若比邻。
  author: 王勃
  work: 送杜少府之任蜀州
- text: 欲穷千里目，更上一层楼。
  author: 王之涣
  work: 登鹳雀楼
- text: 不畏浮云遮望眼，自缘身在最高层。
  author: 王安石
  work: 登飞来峰
- text: 问渠那得清如许？为有源头活水来。
  author: 朱熹
  work: 观书有感·其一
- text: 三更灯火五更鸡，正是男儿读书时。
  author: 颜真卿
  work: 劝学
- text: 千磨万击还坚劲，任尔东西南北风。
  author: 郑燮
  work: 竹石
- text: 海上生明月，天涯共此时。
  author: 张九龄
  work: 望月怀远
- text: 两情若是久长时，又岂在朝朝暮暮。
  author: 秦观
  work: 鹊桥仙·纤云弄巧
- text: 采菊东篱下，悠然见南山。
  author: 陶渊明
  work: 饮酒·其五
- text: 黑发不知勤学早，白首方悔读书迟。
  author: 颜真卿
  work: 劝学
- text: 路漫漫其修远兮，吾将上下而求索。
  author: 屈原
  work: 离骚
- text: 星垂平野阔，月涌大江流。
  author: 杜甫
  work: 旅夜书怀
- text: 此情可待成追忆，只是当时已惘然。
  author: 李商隐
  work: 锦瑟
- text: 疏影横斜水清浅，暗香浮动月黄昏。
  author: 林逋
  work: 山园小梅·其一
