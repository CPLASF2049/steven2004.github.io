# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Steven's Blog
subtitle: '记录技术、工具与生活'
description: >-
  Steven 的个人博客，记录编程、开发工具、学习笔记与日常思考。
keywords: 博客, 技术, 编程, Hexo, NexT, 学习笔记
author: Steven
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 这是「项目站点」：账号 CPLASF2049 下名为 steven2004.github.io 的仓库，
## 不是账号主页站点，所以网址带一层仓库名的子路径。
## 站点地址 = url，站内所有链接前面会自动加上 root。
url: https://CPLASF2049.github.io/steven2004.github.io
## 子路径部署的关键配置：必须以 / 开头和结尾，否则 CSS/JS/菜单链接全部 404
root: /steven2004.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
## 用 'date'：文章更新时间取自 front-matter 的 updated 字段，
## 避免每次重新克隆仓库时 mtime 变化导致所有文章显示为「今天更新」。
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
## 让 source/.nojekyll 被复制到 public/ 根目录，
## 用来关闭 GitHub Pages 默认的 Jekyll 处理（Hexo 默认会忽略点开头的文件）
include:
  - .nojekyll
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
## 主题通过 npm 安装（node_modules/hexo-theme-next），
## 主题配置写在站点根目录的 _config.next.yml 里。
theme: next

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
## 源码保存在 main 分支；hexo deploy 把生成的 public/ 推到 gh-pages 分支，
## 再由 GitHub Pages 从 gh-pages 分支发布。（详见 README.md）
deploy:
  type: git
  repo: https://github.com/CPLASF2049/steven2004.github.io.git
  branch: gh-pages
  message: 'Site updated: {{ now("YYYY-MM-DD HH:mm:ss") }}'
  # 如果推送较慢或需要代理，可以改用 SSH 地址：
  # repo: git@github.com:CPLASF2049/steven2004.github.io.git

# RSS 订阅（hexo-generator-feed）
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# 本地搜索（hexo-generator-searchdb，配合 NexT 的 local_search）
search:
  path: search.xml
  field: post
  content: true
  format: html
  limit: 10000

# 站点地图（hexo-generator-sitemap）
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# 数学公式服务端渲染（hexo-filter-mathjax，配合 NexT 的 math.mathjax: false）
# 用法：在需要公式的文章 front-matter 中加 `mathjax: true`
#
# 注意：这个插件在 markdown 渲染**之后**才运行，而 markdown 会吃掉反斜杠转义，
# 所以在 markdown 里写 LaTeX 时，遇到"反斜杠 + 半角标点"要写成两个反斜杠：
#   markdown 里写 \\\\   -> LaTeX 收到 \\   （矩阵/多行公式的换行）
#   markdown 里写 \\,    -> LaTeX 收到 \,   （细空格）
#   markdown 里写 \\{    -> LaTeX 收到 \{   （字面大括号）
# 详见 source/_posts/next-theme-writing-guide.md 的「数学公式」一节。
mathjax:
  tags: none # 可选 none | ams | all
  single_dollars: true # 允许 $...$ 行内公式
  cjk_width: 0.9
  normal_width: 0.6
  append_css: true
  every_page: false
  # 额外加载的 TeX 扩展包。ams 提供 pmatrix / align / cases 等环境，必须加。
  packages:
    - ams
    - physics
